[project]
name = "vulners-mcp"
version = "1.0.3"
description = "MCP interface server fronting the Vulners API (https://vulners.com)"
readme = "README.md"
authors = [{name = "Vulners Team", email = "dev@vulners.com"}]
keywords = ["MCP", "security", "network", "vulners", "vulnerability", "CVE"]
requires-python = ">=3.13,<4.0"
dependencies = [
    "mcp[cli] (>=1.20.0,<1.23)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.12.5,<3.0)",
    "starlette (>=0.50.0,<0.51.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "fastmcp (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.8"

